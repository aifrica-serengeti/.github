name: 🛠️ 리팩토링
description: 코드 리팩토링 작업을 정의합니다
title: "[Refactor] "
labels: ["refactoring"]

body:
  - type: markdown
    attributes:
      value: |
        ## 리팩토링 이슈

  - type: textarea
    id: summary
    attributes:
      label: 리팩토링 개요
      description: 어떤 코드를 리팩토링할지 설명해주세요
      placeholder: 예: UserProfile 컴포넌트의 데이터 페칭 로직을 Custom Hook으로 분리
    validations:
      required: true

  - type: dropdown
    id: purpose
    attributes:
      label: 목적
      options:
        - 가독성 향상
        - 성능 최적화
        - 중복 코드 제거
        - 테스트 용이성
        - 기술 부채 해결
        - 유지보수성 개선
    validations:
      required: true

  - type: textarea
    id: current-issue
    attributes:
      label: 현재 문제점
      description: 현재 코드의 어떤 문제를 개선하고자 하는지 작성해주세요
      placeholder: |
        - 데이터 페칭 로직이 컴포넌트 내부에 있어 테스트가 어려움
        - 다른 컴포넌트에서 동일한 로직이 중복됨

  - type: textarea
    id: approach
    attributes:
      label: 개선 방안
      description: 어떻게 리팩토링할지 작성해주세요
      placeholder: useUserProfileData Custom Hook을 생성하여 로직 분리

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      placeholder: |
        - [ ] 기존 로직 분석
        - [ ] Custom Hook 구현
        - [ ] 기존 컴포넌트 수정
        - [ ] 테스트 코드 작성 및 수정
        - [ ] 회귀 테스트

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 리팩토링으로 영향받는 다른 모듈이 있다면 작성해주세요
