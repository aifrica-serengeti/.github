name: 🎯 마일스톤
description: 프로젝트 마일스톤을 정의합니다
title: "[Milestone] "
labels: ["milestone"]

body:
  - type: textarea
    id: goal
    attributes:
      label: 마일스톤 목표
      description: 이 마일스톤의 핵심 목표를 간단히 설명해주세요
      placeholder: "예: 사용자 인증 시스템 구축"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 상세 설명
      description: 마일스톤에 대한 추가 정보를 입력해주세요