name: 🐛 버그 수정
description: 버그 수정 작업을 정의합니다
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## 버그 수정 이슈

  - type: textarea
    id: bug-summary
    attributes:
      label: 버그 개요
      description: 어떤 버그를 수정하는지 간단히 설명해주세요
      placeholder: "예: 로그인 버튼 클릭 시 반응 없는 문제 수정"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 버그를 재현할 수 있는 단계를 작성해주세요
      placeholder: |
        1. 로그인 페이지 접속
        2. 이메일/비밀번호 입력
        3. 로그인 버튼 클릭
        4. 반응 없음
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: 원인 분석
      description: 버그의 원인을 분석한 내용을 작성해주세요
      placeholder: "onClick 핸들러가 바인딩되지 않음"

  - type: textarea
    id: solution
    attributes:
      label: 해결 방안
      description: 어떻게 수정할지 계획을 작성해주세요
      placeholder: "이벤트 핸들러를 useEffect로 바인딩"

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 수정 작업을 위한 태스크를 작성해주세요
      placeholder: |
        - [ ] 원인 코드 확인
        - [ ] 이벤트 핸들러 수정
        - [ ] 테스트 코드 작성
        - [ ] 수동 테스트

  - type: textarea
    id: notes
    attributes:
      label: 비고
      description: 추가로 기록할 내용이 있다면 작성해주세요
