name: "🚨 Hotfix"
description: "정규 릴리스 절차를 거치지 않고 긴급하게 배포되는 치명적 이슈의 수정"
type: Hotfix

body:
  - type: markdown
    attributes:
      value: |
        ```Hotfix``` 정규 릴리스 절차를 건너뛰는 긴급 수정

  - type: textarea
    id: description
    attributes:
      label: 문제 상황
      value: |
        지금 무엇이 깨져 있는가

        ### 영향 범위
        - 영향받는 환경 / 고객사 / 사용자 수
        - 언제부터 발생했는가

        ### 긴급한 이유
        정규 릴리스를 기다릴 수 없는 근거

        ### 조치
        - [ ] 임시 조치 (있다면)
        - [ ] 근본 수정
        - [ ] 배포 확인

        ### 후속 (선택)
        - 재발 방지를 위해 따로 만들 이슈
    validations:
      required: true
