name: "🔍 Research"
description: "의사결정을 위한 조사, 벤치마킹, 기술 검증(PoC)"
type: Research

body:
  - type: markdown
    attributes:
      value: |
        ```Research``` 의사결정을 위한 조사·벤치마킹·기술 검증(PoC)

  - type: textarea
    id: description
    attributes:
      label: 질문
      value: |
        무엇을 알아내야 하는가

        ### 배경
        어떤 결정을 앞두고 있는가

        ### 조사 범위
        - 무엇까지 보고 무엇은 보지 않는가

        ### 산출물
        - 결론을 어디에 남기는가 (이 이슈 코멘트 / 문서 / ADR)

        ### 기한 (선택)
        언제까지 답이 필요한가

        ### 결과
        (조사 후 작성)
    validations:
      required: true
