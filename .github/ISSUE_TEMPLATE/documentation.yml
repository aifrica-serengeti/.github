name: 📄 문서 작업
description: 문서 작성/수정 작업을 정의합니다
title: "[Docs] "
labels: ["documentation"]

body:
  - type: markdown
    attributes:
      value: |
        ## 문서 작업 이슈

  - type: dropdown
    id: doc-type
    attributes:
      label: 문서 종류
      options:
        - README
        - API 문서
        - Wiki
        - 코드 주석
        - 사용자 가이드
        - 개발자 가이드
        - 기타
    validations:
      required: true

  - type: dropdown
    id: action-type
    attributes:
      label: 작업 유형
      options:
        - 신규 작성
        - 내용 추가
        - 내용 수정
        - 오탈자 수정
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 작업 내용
      description: 어떤 내용을 추가/수정할지 작성해주세요
      placeholder: 설치 방법 섹션에 Docker를 이용한 설치 방법 추가
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      placeholder: |
        - [ ] 설치 방법 문구 작성
        - [ ] Dockerfile 예시 추가
        - [ ] 스크린샷 촬영 및 첨부

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 참고할 링크나 자료가 있다면 작성해주세요
